<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>포항양덕초 5학년 6반 분수의 곱셈 도전</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f2f6fb;--card:#fff;--ink:#14213d;--mute:#5b6b85;--line:#c3cfe2;--ac:#0b6fa4;--acink:#fff;--ok:#1a7f45;--okbg:#e4f5ea;--no:#b8322a;--nobg:#fdeaea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1729;--card:#18233b;--ink:#e8eefb;--mute:#9db0d0;--line:#3a4c70;--ac:#5cc0ea;--acink:#0f1729;--ok:#6fd39a;--okbg:#143022;--no:#f28b82;--nobg:#3a1c1e}}
:root[data-theme="dark"]{--bg:#0f1729;--card:#18233b;--ink:#e8eefb;--mute:#9db0d0;--line:#3a4c70;--ac:#5cc0ea;--acink:#0f1729;--ok:#6fd39a;--okbg:#143022;--no:#f28b82;--nobg:#3a1c1e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:20px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input,summary{touch-action:manipulation}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 14px;font-size:.95rem}
.hd{display:flex;align-items:center;justify-content:center;text-align:center;gap:18px;padding:14px 18px;margin-bottom:18px;background:var(--card);border:1.5px solid var(--line);border-top:6px solid var(--ac);border-radius:14px}
.emb{width:88px;height:88px;flex:none;background:#fff;border-radius:50%;padding:3px;overflow:hidden}
.emb img{width:100%;height:100%;display:block;object-fit:contain}
.school{font-size:1.6rem;font-weight:bold;letter-spacing:.02em}
.cls{display:inline-block;margin-top:2px;padding:1px 14px;border-radius:999px;background:var(--ac);color:var(--acink);font-size:1.15rem}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.tabs button{font:inherit;font-size:1.05rem;min-height:50px;padding:8px 22px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.tabs button:disabled{opacity:.5;cursor:not-allowed}
.tabs button[aria-pressed=true]{background:var(--ac);color:var(--acink);border-color:var(--ac)}
#lvinfo{color:var(--mute);font-size:.95rem;margin:0 0 16px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}
.p{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:18px 20px}
.p.ok{border-color:var(--ok);background:var(--okbg)}
.p.no{border-color:var(--no);background:var(--nobg)}
.num{font-weight:bold;color:var(--mute);font-size:.9rem;margin-bottom:4px}
.q{font-size:1.45rem}
.txt{font-size:1.2rem;line-height:1.7;display:block;margin-bottom:8px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.15;font-size:.92em}
.fr i{font-style:normal;padding:0 .2em}
.fr i:first-child{border-bottom:1.5px solid currentColor}
.w{margin-left:.1em}
.ans{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;margin:2px 4px}
.fbox{display:inline-flex;flex-direction:column;align-items:center;gap:0}
.fbox hr{width:100%;margin:2px 0;border:0;border-top:2px solid var(--ink)}
input.bx{font:inherit;font-size:1.5rem;width:2.6em;height:2.1em;text-align:center;padding:0;border:2px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
input.bx.wh{width:2.6em;height:3.4em}
input.bx.nat{width:3.4em}
.fb{margin-top:8px;font-size:.95rem}
.fb b{color:var(--ok)}.no .fb b{color:var(--no)}
details{margin-top:6px;font-size:.95rem;color:var(--mute)}
details div{margin-top:6px;color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:20px;position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:1.5px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px))}
.qr .bar{position:static;border:0;padding:0}
.bar button{font:inherit;font-size:1.15rem;min-height:54px;padding:10px 30px;border-radius:10px;border:1.5px solid var(--ac);cursor:pointer;background:var(--ac);color:var(--acink)}
.bar button.g{background:transparent;color:var(--ac)}
#score{font-size:1.15rem}
.guide{background:var(--card);border:1.5px dashed var(--line);border-radius:10px;padding:8px 14px;margin-bottom:16px;font-size:.95rem}
.mk{margin:28px 0 0;text-align:right;font-size:.8rem;color:var(--mute)}
#game{display:none}
.gaming #game{display:block}
.gaming #practice,.gaming .qr{display:none}
#game h2{font-size:1.5rem;margin:0 0 4px;text-align:center}
.gtip{color:var(--mute);margin:0 0 12px;text-align:center}
#gst{justify-content:center}
#gsvg{display:block;margin:12px auto;width:min(100%,60vh,560px);height:auto;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--card);border:1.5px solid var(--line);border-radius:16px}
#gmsg{text-align:center;font-size:1.2rem;min-height:1.8em}
#gbar{justify-content:center}
.qr{margin-top:28px}
#qrbox{background:#fff;display:inline-block;padding:12px;border-radius:8px;margin:10px 0}
#qrurl{font:inherit;font-size:.9rem;width:100%;padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
</style>
</head>

    <div><div id="qrbox"></div></div>
    <div class="bar" style="margin-top:0"><button class="g" id="qrbtn">QR 다시 만들기</button></div>
  </div>
</details>
<footer class="mk">made by 장쌤</footer>
</main>
<script>
let _s=1;const seed=n=>{_s=n>>>0};
const R=(a,b)=>{_s=(_s+0x6D2B79F5)>>>0;let t=_s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return a+Math.floor(((t^t>>>14)>>>0)/4294967296*(b-a+1))};
const g=(a,b)=>b?g(b,a%b):a;
const fr=(n,d)=>`<span class="fr"><i>${n}</i><i>${d}</i></span>`;
const show=x=>!x.n?`${x.w}`:(x.w?`<span class="w">${x.w}</span>`:'')+fr(x.n,x.d);
let L;
const P=()=>{const d=R(2,L.d),n=R(1,d-1);return{w:0,n,d}};
const M=()=>{const p=P();p.w=R(1,L.w);return p};
const N=()=>({w:R(2,L.n),n:0,d:1});
const imp=x=>[x.w*x.d+x.n,x.d];
function res(n,d){const k=g(n,d);n/=k;d/=k;if(d==1)return`${n}`;const w=Math.floor(n/d),r=n%d;return w?`<span class="w">${w}</span>`+fr(r,d):fr(r,d)}
function canon(n,d){const k=g(n,d);n/=k;d/=k;const w=d==1?n:Math.floor(n/d);return[w,d==1?0:n%d,d==1?0:d]}
function sol(it){const ip=it.map(imp);let A=1,B=1;ip.forEach(([n,d])=>{A*=n;B*=d});
 let h='';const mx=it.filter(x=>x.w&&x.n);
 if(mx.length)h+='대분수를 가분수로: '+mx.map(x=>show(x)+' = '+fr(...imp(x))).join(', ')+'<br>';
 h+=ip.map(([n,d])=>d==1?n:fr(n,d)).join(' × ')+' = '+fr(A,B);
 if(g(A,B)>1||A>B)h+=' = '+res(A,B);
 return{h,A,B}}
const NM=['민수','서후','예린','주완','지완','채연','남준','재성','서준','진혁','유라','예건','하영','건우','승우','아라','재빈','예하','예은','민서','재훈','정원','수빈','도현','우준'];
const bt=s=>{const c=s.charCodeAt(s.length-1)-44032;return c>=0&&c%28>0};
const nn=s=>s+(bt(s)?'이':'');
const j=(s,a)=>nn(s)+(a==='은'?'는':'가');
let used=[],wi=0;
const nm=()=>{let n;do{n=NM[R(0,NM.length-1)]}while(used.includes(n)&&used.length<NM.length);used.push(n);return n};
const W=[
()=>{const n=nm(),a=P(),b=P();return{items:[a,b],t:`${j(n,'은','는')} 주스를 ${show(a)} L 가지고 있습니다. 그중 ${show(b)}만큼 마셨다면 ${j(n,'이','가')} 마신 주스는 몇 L일까요?`,u:'L'}},
()=>{const n=nm(),a=M(),b=M();return{items:[a,b],t:`${j(n,'은','는')} 가로가 ${show(a)} m, 세로가 ${show(b)} m인 직사각형 모양의 꽃밭을 만들었습니다. 이 꽃밭의 넓이는 몇 m²일까요?`,u:'m²'}},
()=>{const n=nm(),a=P(),b=N();return{items:[a,b],t:`${nn(n)}네 집에서 쓰는 밀가루 한 봉지는 ${show(a)} kg입니다. ${b.w}봉지는 모두 몇 kg일까요?`,u:'kg'}},
()=>{const n=nm(),a=M(),b=N();return{items:[a,b],t:`${j(n,'은','는')} 매일 ${show(a)}시간씩 ${b.w}일 동안 운동했습니다. ${j(n,'이','가')} 운동한 시간은 모두 몇 시간일까요?`,u:'시간'}},
()=>{const n=nm(),a={w:R(2,4)*3,n:0,d:1},b=P();return{items:[a,b],t:`${j(n,'은','는')} 리본 ${a.w} m 중 ${show(b)}만큼 사용했습니다. 사용한 리본은 몇 m일까요?`,u:'m'}},
()=>{const n=nm(),a=N(),b=M();return{items:[a,b],t:`${j(n,'은','는')} 고구마를 ${a.w} kg 캤습니다. 감자는 고구마의 ${show(b)}배만큼 캤다면 캔 감자는 몇 kg일까요?`,u:'kg'}},
()=>{const n=nm(),d=R(2,6),b={w:0,n:R(1,d-1),d},a={w:d*R(2,4),n:0,d:1};return{items:[a,b],t:`${j(n,'은','는')} ${a.w}쪽짜리 동화책을 읽고 있습니다. 전체의 ${show(b)}만큼 읽었다면 읽은 쪽수는 몇 쪽일까요?`,u:'쪽'}},
()=>{const n=nm(),a=M(),b=P();return{items:[a,b],t:`${j(n,'은','는')} 페인트 ${show(a)} L 중 ${show(b)}만큼 사용했습니다. 사용한 페인트는 몇 L일까요?`,u:'L'}}
];
const word=()=>W[wi++%W.length]();
const LV=[null,
 {d:5,w:2,n:8,pass:8,t:'분수와 자연수의 곱셈',g:[()=>[P(),N()],()=>[N(),P()],()=>[M(),N()],()=>[N(),M()]]},
 {d:6,w:3,n:9,pass:8,t:'분수끼리의 곱셈과 약분하기',g:[()=>[P(),P()],()=>[M(),M()],()=>[P(),M()],()=>[P(),P(),P()]]},
 {d:6,w:3,n:9,c:8,pass:7,t:'도전! 문장제 8문제',g:[word]}];
let cur=1,set=[],unlocked=1;
try{unlocked=Math.min(3,Math.max(1,+localStorage.getItem('fm56_top')||1))}catch(e){}
const OPEN_ALL=false;if(OPEN_ALL)unlocked=3;
const saveTop=()=>{try{localStorage.setItem('fm56_top',unlocked)}catch(e){}};
function make(){const r=LV[cur].g[R(0,LV[cur].g.length-1)]();const p=Array.isArray(r)?{items:r}:r;p.s=sol(p.items);return p}
const box=(cls,lab,key)=>`<input class="bx ${cls}" data-k="${key}" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="next" maxlength="3" autocomplete="off" aria-label="${lab}">`;
function ansHtml(p,i){const[w,n]=canon(p.s.A,p.s.B),k=(i+1)+'번 ';
 const f=`<span class="fbox">${box('',k+'분자','n')}<hr>${box('',k+'분모','d')}</span>`;
 if(!n)return box('nat',k+'답','w');
 return w?box('wh',k+'자연수','w')+f:f}
function build(){
 L=LV[cur];seed(cur*7919+13);used=[];wi=0;lvinfo.textContent=`${cur}단계: ${L.t}`;
 set=Array.from({length:L.c||10},make);
 grid.innerHTML=set.map((p,i)=>`<div class="p" id="p${i}"><div class="num">${i+1}번</div><div class="q">${p.t?`<span class="txt">${p.t}</span>`:p.items.map(show).join(' × ')+' = '}<span class="ans">${ansHtml(p,i)}</span>${p.u||''}</div><div class="fb" id="f${i}"></div></div>`).join('');
 score.textContent='';
 const ins=[...grid.querySelectorAll('input')];
 ins.forEach((el,k)=>{el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'')});el.addEventListener('focus',()=>{setTimeout(()=>el.scrollIntoView({block:'center',behavior:'smooth'}),300)});el.addEventListener('keydown',e=>{if(e.key==='Enter'){(ins[k+1]||chk).focus()}})});
}
const v=el=>el.value===''?null:+el.value;
function grade(){
 const rs=set.map((p,i)=>{
  const q=k=>{const e=document.querySelector(`#p${i} [data-k=${k}]`);return e?v(e):null},W_=q('w'),n=q('n'),d=q('d'),{A,B}=p.s;
  let good=false,note='',msg='';
  if(W_===null&&n===null&&d===null)msg='답을 쓰지 않았어요.';
  else if((n===null)!==(d===null)||d===0)msg='분자와 분모를 모두 채워 주세요.';
  else{const D=d||1,Nn=(W_||0)*D+(n||0);good=Nn*B===A*D;
   if(good){const c=canon(A,B),s=[W_||0,n||0,d||0];if(c.join()!==s.join()){good=false;msg='값은 같지만 아직 약분되지 않았어요.'}}}
  return{good,note,msg}});
 const ok=rs.filter(r=>r.good).length,pass=ok>=L.pass;
 rs.forEach((r,i)=>{const{A,B,h}=set[i].s,det=`<details><summary>풀이 보기</summary><div>${h}</div></details>`;
  document.getElementById('p'+i).className='p '+(r.good?'ok':'no');
  document.getElementById('f'+i).innerHTML=r.good?`<b>정답!</b>${r.note}${det}`:`<b>다시 확인해 보세요.</b> ${r.msg}`+(pass?` 정답: ${res(A,B)}${det}`:'')});
 let m=`${set.length}문제 중 ${ok}문제 정답`;
 if(pass){if(cur===3){m+=' · 모든 단계 통과! 🎉 보상 게임이 열렸어요!';reward=true;saveRw();showRw()}else if(cur===unlocked){unlocked++;saveTop();drawTabs();m+=` · 통과! ${unlocked}단계가 열렸어요`}else m+=' · 통과!'}
 else m+=` · ${L.pass}문제 이상 맞히면 ${cur===3?'통과예요':'다음 단계가 열려요'}. 틀린 문제를 고쳐 다시 채점해 보세요`;
 score.textContent=m;
}
function drawTabs(){tabs.innerHTML=[1,2,3].map(i=>`<button aria-pressed="${i==cur}" data-i="${i}"${i>unlocked?' disabled':''}>${i}단계${i>unlocked?' 🔒':''}</button>`).join('')}
function drawQR(){qrbox.innerHTML='';if(typeof QRCode!=='undefined'&&qrurl.value.trim())new QRCode(qrbox,{text:qrurl.value.trim(),width:220,height:220});else qrbox.textContent='QR 코드를 불러오지 못했어요.'}
const tabs=document.getElementById('tabs'),grid=document.getElementById('grid'),score=document.getElementById('score'),chk=document.getElementById('chk'),lvinfo=document.getElementById('lvinfo'),qrbox=document.getElementById('qrbox'),qrurl=document.getElementById('qrurl');
tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cur=+b.dataset.i;drawTabs();build()});
chk.onclick=grade;
document.getElementById('qrbtn').onclick=drawQR;
document.getElementById('qrd').addEventListener('toggle',e=>{if(e.target.open&&!qrbox.firstChild)drawQR()});

let reward=false;const REWARD_OPEN=false;
try{reward=localStorage.getItem('fm56_reward')==='1'}catch(e){}
const saveRw=()=>{try{localStorage.setItem('fm56_reward','1')}catch(e){}};
const rwd=document.getElementById('rwd');
const showRw=()=>{rwd.hidden=!(reward||REWARD_OPEN)};
const ring=(n,R,o)=>Array.from({length:n},(_,i)=>{const a=(o+360/n*i)*Math.PI/180;return[160+R*Math.cos(a),160+R*Math.sin(a)]});
const pairs=n=>{const r=[];for(let i=0;i<n;i++)for(let k=i+1;k<n;k++)r.push([i,k]);return r};
const hexE=[];for(let k=0;k<6;k++)hexE.push([k,6+(k+5)%6],[k,6+k],[6+k,6+(k+1)%6]);
const STG=[
 {t:'리본',p:[[60,90],[60,230],[160,160],[260,90],[260,230]],e:[[0,1],[1,2],[2,0],[2,3],[3,4],[4,2]]},
 {t:'별',p:ring(5,120,-90),e:[[0,2],[2,4],[4,1],[1,3],[3,0]]},
 {t:'사다리',p:[[90,60],[90,160],[90,260],[230,60],[230,160],[230,260]],e:[[0,1],[1,2],[3,4],[4,5],[0,3],[1,4],[2,5]]},
 {t:'집',p:[[80,270],[240,270],[240,150],[80,150],[160,60]],e:[[0,1],[1,2],[2,3],[3,0],[0,2],[1,3],[2,4],[3,4]]},
 {t:'오각별',p:ring(5,120,-90),e:pairs(5)},
 {t:'육각별',p:ring(6,130,-90).concat(ring(6,75,-60)),e:hexE}
];
const gsvg=document.getElementById('gsvg'),gmsg=document.getElementById('gmsg'),gst=document.getElementById('gst');
let gi=0,gs,down=false;
const ek=(a,b)=>a<b?a+'-'+b:b+'-'+a;
function gnew(){gs={cur:null,used:new Set(),hist:[],done:false};gdraw()}
function gdraw(){
 const s=STG[gi],Q=s.p,U=gs.used;
 gsvg.innerHTML=s.e.map(([a,b],i)=>`<line x1="${Q[a][0]}" y1="${Q[a][1]}" x2="${Q[b][0]}" y2="${Q[b][1]}" style="stroke:${U.has(i)?'var(--ac)':'var(--line)'}" stroke-width="${U.has(i)?11:7}" stroke-linecap="round"/>`).join('')+Q.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="17" style="fill:${gs.cur===i?'var(--ac)':'var(--card)'};stroke:var(--ac)" stroke-width="4"/>`).join('');
 const left=s.e.length-U.size;gs.done=left===0;
 const stuck=!gs.done&&gs.cur!==null&&!s.e.some(([a,b],i)=>!U.has(i)&&(a===gs.cur||b===gs.cur));
 const odd=Q.some((_,i)=>s.e.filter(([a,b])=>a===i||b===i).length%2);
 gmsg.textContent=gs.done?(gi<STG.length-1?'성공! 🎉 다음 판에 도전해 보세요':'모든 판 성공! 대단해요 🏆'):stuck?'더 갈 곳이 없어요. 되돌리기를 눌러 다른 길로 가 보세요.'+(odd?' (힌트: 선이 홀수 개 만나는 점에서 시작해 보세요)':''):`남은 선 ${left}개`;
 gst.innerHTML=STG.map((x,i)=>`<button data-i="${i}" aria-pressed="${i==gi}">${i+1}판 ${x.t}</button>`).join('');
}
const gpt=e=>{const r=gsvg.getBoundingClientRect();return[(e.clientX-r.left)/r.width*320,(e.clientY-r.top)/r.height*320]};
function gmove(e){
 if(gs.done)return;const s=STG[gi],[x,y]=gpt(e);
 const k=s.p.findIndex(([px,py])=>Math.hypot(px-x,py-y)<34);if(k<0)return;
 if(gs.cur===null){gs.cur=k;gdraw();return}
 if(k===gs.cur)return;
 const ei=s.e.findIndex(([a,b])=>ek(a,b)===ek(gs.cur,k));
 if(ei<0||gs.used.has(ei))return;
 gs.used.add(ei);gs.hist.push([gs.cur,ei]);gs.cur=k;gdraw()}
gsvg.addEventListener('pointerdown',e=>{down=true;try{gsvg.setPointerCapture(e.pointerId)}catch(_){}gmove(e)});
gsvg.addEventListener('pointermove',e=>{if(down)gmove(e)});
['pointerup','pointercancel'].forEach(t=>gsvg.addEventListener(t,()=>{down=false}));
gst.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;gi=+b.dataset.i;gnew()});
document.getElementById('gundo').onclick=()=>{if(gs.hist.length){const[pc,ei]=gs.hist.pop();gs.used.delete(ei);gs.cur=pc}else gs.cur=null;gdraw()};
document.getElementById('greset').onclick=gnew;
document.getElementById('gnext').onclick=()=>{gi=(gi+1)%STG.length;gnew()};
document.getElementById('gback').onclick=()=>{document.body.classList.remove('gaming');window.scrollTo(0,0)};
rwd.onclick=()=>{document.body.classList.add('gaming');gnew();window.scrollTo(0,0)};
showRw();
drawTabs();build();
</script>
